<svg xmlns="http://www.w3.org/2000/svg" viewBox="222 236 580 580" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>

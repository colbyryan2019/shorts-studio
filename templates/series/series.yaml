# Settings for this series. Unknown keys are rejected, so a typo shows up as an error.
title: "__TITLE__"
voice_id: ""                     # ElevenLabs narrator voice ID (Voices -> the voice -> ID)
words: [118, 135]                # narration length range in words (about 65 s)
shots: [12, 16]
max_genvideo_shots: 2
end_card_format: ""              # e.g. "DAY {day} · WATER: {water}"; the script fills it in
default_motion: pushin           # pushin | rock | drift
caption_style: highlight_word    # highlight_word | bold_white_outline | plain_white
caption_font: ""                 # optional: a file in assets/fonts, e.g. Anton-Regular.ttf (empty = first one)
music_volume_db: -20             # dB under the narration (more negative = quieter)
sfx_volume_db: -26               # ambience bed from sfx/ (or assets/sfx/); no files = no bed
line_pause_seconds: 0.3          # silence after each line; raise for slower, heavier pacing
# voice_settings:                # optional ElevenLabs delivery; leave out to use the voice's defaults
#   stability: 0.5               # lower = more expressive, higher = steadier
#   similarity_boost: 0.75
#   style: 0.0                   # higher = more dramatic delivery
#   speed: 1.0                   # 0.7 to 1.2
sources_required: true           # every factual claim must cite a file in sources/; false for pure fiction
research_guidance: ""            # which sources research.py should prefer, e.g. official manuals, no forums
image_quality: medium            # low | medium | high

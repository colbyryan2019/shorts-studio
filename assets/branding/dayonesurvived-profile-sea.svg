<svg xmlns="http://www.w3.org/2000/svg" viewBox="212 262 600 600" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1830"/>
      <stop offset="0.45" stop-color="#2c2a52"/>
      <stop offset="0.75" stop-color="#a24a4a"/>
      <stop offset="1" stop-color="#f08a3e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16263f"/>
      <stop offset="1" stop-color="#060f1c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.55" stop-color="#ffc463"/>
      <stop offset="1" stop-color="#ff8a3a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb35a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb35a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect x="0" y="0" width="1024" height="600"/></clipPath>
  </defs>
  <rect width="1024" height="600" fill="url(#sky)"/>
  <circle cx="512" cy="600" r="420" fill="url(#glow)" clip-path="url(#above)"/>
  <circle cx="512" cy="600" r="235" fill="url(#sun)" clip-path="url(#above)"/>
  <rect y="600" width="1024" height="424" fill="url(#sea)"/>
  <g fill="#ffb760">
    <rect x="352" y="606" width="320" height="7" rx="3.5" opacity="0.85"/>
    <rect x="392" y="640" width="240" height="6" rx="3" opacity="0.7"/>
    <rect x="300" y="676" width="150" height="6" rx="3" opacity="0.45"/>
    <rect x="560" y="676" width="170" height="6" rx="3" opacity="0.45"/>
    <rect x="430" y="714" width="170" height="5" rx="2.5" opacity="0.5"/>
    <rect x="470" y="760" width="90" height="5" rx="2.5" opacity="0.35"/>
    <rect x="360" y="800" width="80" height="4" rx="2" opacity="0.22"/>
    <rect x="590" y="820" width="70" height="4" rx="2" opacity="0.22"/>
    <rect x="490" y="870" width="50" height="4" rx="2" opacity="0.18"/>
  </g>
  <!-- survivor in a dinghy, silhouetted against the rising sun -->
  <g fill="#0a1422">
    <!-- torso, slightly hunched -->
    <path d="M452,612 L460,512 Q466,478 506,474 Q546,478 552,512 L562,612 Z"/>
    <!-- arm resting forward on knee -->
    <path d="M540,500 Q584,540 590,590 L572,596 Q560,556 530,528 Z"/>
    <!-- head -->
    <circle cx="506" cy="446" r="31"/>
    <!-- wide-brim hat -->
    <ellipse cx="506" cy="428" rx="74" ry="11"/>
    <path d="M474,430 L478,398 Q506,380 534,398 L538,430 Z"/>
    <!-- dinghy: tube with rounded ends, sitting low in the water -->
    <rect x="340" y="588" width="344" height="52" rx="26"/>
    <path d="M352,620 Q356,660 400,662 L624,662 Q668,660 672,620 Z"/>
  </g>
  <!-- waterline -->
  <rect x="300" y="660" width="424" height="6" rx="3" fill="#0a1422" opacity="0.6"/>
</svg>
